services:
  logscope:
    build: .
    ports:
      # 8200 on the host: SurgiServe uses 8000 and Gatekeeper 8080.
      - "${LOGSCOPE_PORT:-8200}:8000"
    volumes:
      - logscope-data:/data
    restart: unless-stopped
    # Time to finish shutting down (end live tails, flush the memtable)
    # before Docker kills the process. Set explicitly: on the machine this
    # was built on, `docker compose stop` killed it after about a second.
    stop_grace_period: 15s

volumes:
  logscope-data:
